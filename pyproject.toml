[project]
name = "lexcor"
version = "0.2.7"
description = "Packages of terms, their store and their recognition in German text: the common core of lexterm and lexident."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "fre.ms", email = "fre.ms@fre.ms" }]
keywords = ["terminology", "fhir", "codesystem", "dictionary-matching", "german", "nlp"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Linguistic",
]
# the core needs nothing but Python's standard library
dependencies = []

[project.optional-dependencies]
# the package window
window = ["PySide6-Essentials>=6.8"]

[project.scripts]
lexcor = "lexcor.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.11",
  # the whole of Qt for Python, for its type information; the window needs the essentials only
  "PySide6>=6.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lexcor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["lexcor"]
